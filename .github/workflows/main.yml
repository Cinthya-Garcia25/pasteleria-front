name: CI y despliegue EC2

permissions:
  contents: read

concurrency:
  group: pasteleria-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Jest con cobertura
        id: jest
        run: npm test -- --coverage --runInBand

      - name: Instalar navegadores de Playwright
        if: ${{ !cancelled() && steps.jest.outcome != 'skipped' }}
        id: chromium
        run: npx playwright install --with-deps chromium webkit

      - name: Pruebas Playwright
        id: playwright
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:e2e

      - name: Registrar resultado en OpenObserve
        if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          OPENOBSERVE_ENDPOINT: ${{ vars.OPENOBSERVE_ENDPOINT }}
          OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
          EVENT_NAME: tests
          EVENT_RESULT: ${{ job.status }}
          JEST_RESULT: ${{ steps.jest.outcome }}
          PLAYWRIGHT_RESULT: ${{ steps.playwright.outcome }}
        run: node scripts/ci-event.js

  build-and-push:
    name: Construir y publicar imagen Docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y push de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}

  deploy:
    name: Desplegar en AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Desplegar por SSH
        id: ec2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ vars.EC2_FINGERPRINT }}
          script: |
            set -eu
            cd "$HOME/pasteleria-front"
            export APP_TAG=${{ github.sha }}
            docker compose pull app
            docker compose up -d --wait --wait-timeout 90

      - name: Registrar despliegue en OpenObserve
        env:
          OPENOBSERVE_ENDPOINT: ${{ vars.OPENOBSERVE_ENDPOINT }}
          OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
          EVENT_NAME: deploy
          EVENT_RESULT: success
        run: node scripts/ci-event.js
