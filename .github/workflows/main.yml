name: CI y despliegue EC2

permissions:
  contents: read

concurrency:
  group: pasteleria-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Jest con cobertura
        id: jest
        run: npm test -- --coverage --runInBand

      - name: Instalar navegadores de Playwright
        if: ${{ !cancelled() && steps.jest.outcome != 'skipped' }}
        id: chromium
        run: npx playwright install --with-deps chromium webkit

      - name: Pruebas Playwright
        id: playwright
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:e2e

      - name: Registrar resultado en OpenObserve
        if: ${{ always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          OPENOBSERVE_ENDPOINT: ${{ vars.OPENOBSERVE_ENDPOINT }}
          OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
          EVENT_NAME: tests
          EVENT_RESULT: ${{ job.status }}
          JEST_RESULT: ${{ steps.jest.outcome }}
          PLAYWRIGHT_RESULT: ${{ steps.playwright.outcome }}
        run: node scripts/ci-event.js

  build-and-push:
    name: Construir y publicar imagen Docker
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v6

      - name: Login a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Registrar inicio de la construcción
        id: build-start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build y push de la imagen
        id: imagen
        env:
          DOCKER_BUILD_SUMMARY: "false"
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: Escribir el resumen de la imagen
        if: ${{ !cancelled() && steps.imagen.outcome != 'skipped' && steps.imagen.outcome != '' }}
        env:
          BUILD_START: ${{ steps.build-start.outputs.epoch }}
          BUILD_RESULT: ${{ steps.imagen.outcome }}
          BUILD_DIGEST: ${{ steps.imagen.outputs.digest }}
        run: |
          elapsed=$(( $(date +%s) - BUILD_START ))
          if [ "$BUILD_RESULT" = success ]; then
            status="Publicada en Docker Hub"
          else
            status="Falló la construcción o publicación"
          fi
          {
            printf '## Construcción y publicación de la imagen Docker\n\n'
            printf '| Campo | Resultado | Qué significa |\n'
            printf '| --- | --- | --- |\n'
            printf '| Imagen | `%s` | Repositorio de contenedores en Docker Hub. |\n' "$APP_IMAGE"
            printf '| Estado | %s | Resultado de la etapa de imagen. |\n' "$status"
            printf '| Duración | %s min %s s | Tiempo aproximado de construcción y publicación. |\n' "$((elapsed / 60))" "$((elapsed % 60))"
            printf '| Arquitecturas | `linux/amd64` y `linux/arm64` | ARM64 corresponde a la instancia EC2 del proyecto. |\n'
            printf '| Etiquetas | `latest` y `%s` | La primera señala la última publicación y la segunda identifica el commit exacto. |\n' "$GITHUB_SHA"
            printf '| Digest | `%s` | Huella del contenido publicado. |\n' "${BUILD_DIGEST:-Sin digest disponible}"
            printf '\nLos resultados de Jest y Playwright están en **Pruebas y cobertura**. El estado del servidor aparece en **Desplegar en AWS EC2**.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Desplegar en AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Desplegar por SSH
        id: ec2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_FINGERPRINT: ${{ vars.EC2_FINGERPRINT }}
        run: |
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_dir/key"
          ssh-keyscan -T 10 -t ed25519 "$EC2_HOST" > "$ssh_dir/known_hosts"
          fingerprint=$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk 'NR == 1 { print $2 }')
          if [ -z "$EC2_FINGERPRINT" ] || [ "$fingerprint" != "$EC2_FINGERPRINT" ]; then
            echo "::error::La huella Ed25519 del servidor no coincide con EC2_FINGERPRINT."
            exit 1
          fi
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o HostKeyAlgorithms=ssh-ed25519 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "$EC2_USER@$EC2_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -eu
          cd "$HOME/pasteleria-front"
          export APP_TAG=$1
          docker compose pull app
          docker compose up -d --wait --wait-timeout 90
          REMOTE

      - name: Registrar despliegue en OpenObserve
        env:
          OPENOBSERVE_ENDPOINT: ${{ vars.OPENOBSERVE_ENDPOINT }}
          OPENOBSERVE_AUTH: ${{ secrets.OPENOBSERVE_AUTH }}
          EVENT_NAME: deploy
          EVENT_RESULT: success
        run: node scripts/ci-event.js
