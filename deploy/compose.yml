services:
  app:
    image: ${APP_IMAGE:?Configura APP_IMAGE}:${APP_TAG:-latest}
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configura ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD}
      OTEL_SERVICE_NAME: pasteleria-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: 15000
    volumes:
      - sqlite:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    restart: unless-stopped
    network_mode: host
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      OPENOBSERVE_ENDPOINT: ${OPENOBSERVE_ENDPOINT:?Configura OPENOBSERVE_ENDPOINT}
      OPENOBSERVE_AUTH: ${OPENOBSERVE_AUTH:?Configura OPENOBSERVE_AUTH}
    volumes:
      - ./collector.yml:/etc/otelcol/config.yml:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    network_mode: host
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.thermal_zone
    volumes:
      - /sys:/host/sys:ro
volumes:
  sqlite:
